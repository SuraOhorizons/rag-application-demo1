name: CD - Deploy RAG Backend

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: crsuradev
  REGISTRY: crsuradev.azurecr.io
  IMAGE_NAME: rag-application-demo1
  IMAGE_TAG: v0.1.0

  AKS_CLUSTER: aks-sura-dev
  AKS_RESOURCE_GROUP: RG-PRY-SURA-PLF-ENGINEERING
  AKS_NAMESPACE: default

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # AZURE LOGIN - OIDC
      # ============================================================
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ============================================================
      # ACR LOGIN
      # ============================================================
      - name: Login to Azure Container Registry
        run: |
          echo "===== ACR LOGIN ====="
          echo "Registry: ${REGISTRY}"

          az acr login \
            --name "$ACR_NAME"

      # ============================================================
      # BUILD IMAGE
      # ============================================================
      - name: Build Docker image
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "===== BUILDING IMAGE ====="
          echo "Image: ${FULL_IMAGE}"

          docker build \
            -t "${FULL_IMAGE}" \
            .

      # ============================================================
      # PUSH IMAGE
      # ============================================================
      - name: Push Docker image
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "===== PUSHING IMAGE ====="
          echo "Image: ${FULL_IMAGE}"

          docker push "${FULL_IMAGE}"

      # ============================================================
      # VERIFY IMAGE
      # ============================================================
      - name: Verify image in ACR
        run: |
          echo "===== VERIFYING IMAGE ====="

          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output table

      # ============================================================
      # GET AKS CREDENTIALS
      # ============================================================
      - name: Get AKS credentials
        run: |
          echo "===== GETTING AKS CREDENTIALS ====="
          echo "Cluster: ${AKS_CLUSTER}"
          echo "Resource Group: ${AKS_RESOURCE_GROUP}"

          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing

      # ============================================================
      # VERIFY AKS CONNECTION
      # ============================================================
      - name: Verify AKS context
        run: |
          echo "===== AKS CONTEXT ====="

          kubectl config current-context

          echo "===== AKS NODES ====="

          kubectl get nodes

      # ============================================================
      # DEPLOY KUBERNETES
      # ============================================================
      - name: Deploy with Kustomize
        run: |
          echo "===== DEPLOYING KUBERNETES RESOURCES ====="

          kubectl apply \
            -k deploy/kubernetes \
            -n "$AKS_NAMESPACE"

      # ============================================================
      # UPDATE IMAGE
      # ============================================================
      - name: Update deployment image
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"

          echo "===== UPDATING DEPLOYMENT IMAGE ====="
          echo "Image: ${FULL_IMAGE}"

          kubectl set image \
            deployment/rag-application-demo1 \
            rag-application-demo1="${FULL_IMAGE}" \
            -n "$AKS_NAMESPACE"

      # ============================================================
      # WAIT FOR ROLLOUT
      # ============================================================
      - name: Wait for rollout
        run: |
          echo "===== WAITING FOR ROLLOUT ====="

          kubectl rollout status \
            deployment/rag-application-demo1 \
            -n "$AKS_NAMESPACE" \
            --timeout=180s

      # ============================================================
      # VERIFY DEPLOYMENT
      # ============================================================
      - name: Verify deployment
        run: |
          echo "===== DEPLOYMENT ====="

          kubectl get deployment \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"

          echo "===== PODS ====="

          kubectl get pods \
            -n "$AKS_NAMESPACE" \
            -l app.kubernetes.io/name=rag-application-demo1 \
            -o wide

          echo "===== SERVICE ====="

          kubectl get service \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"

          echo "===== HPA ====="

          kubectl get hpa \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"

          echo "===== INGRESS ====="

          kubectl get ingress \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"

      # ============================================================
      # VERIFY POD HEALTH
      # ============================================================
      - name: Health check
        run: |
          POD=$(kubectl get pods \
            -n "$AKS_NAMESPACE" \
            -l app.kubernetes.io/name=rag-application-demo1 \
            -o jsonpath='{.items[0].metadata.name}')

          echo "===== HEALTH CHECK ====="
          echo "Testing pod: ${POD}"

          kubectl exec \
            -n "$AKS_NAMESPACE" \
            "$POD" \
            -- python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health').read().decode())"

      # ============================================================
      # VERIFY READINESS
      # ============================================================
      - name: Readiness check
        run: |
          POD=$(kubectl get pods \
            -n "$AKS_NAMESPACE" \
            -l app.kubernetes.io/name=rag-application-demo1 \
            -o jsonpath='{.items[0].metadata.name}')

          echo "===== READINESS CHECK ====="
          echo "Testing pod: ${POD}"

          kubectl exec \
            -n "$AKS_NAMESPACE" \
            "$POD" \
            -- python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready').read().decode())"

      # ============================================================
      # FINAL STATUS
      # ============================================================
      - name: Deployment summary
        run: |
          echo "======================================"
          echo "RAG BACKEND DEPLOYMENT COMPLETE"
          echo "======================================"
          echo "Application : ${IMAGE_NAME}"
          echo "Image       : ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "AKS Cluster : ${AKS_CLUSTER}"
          echo "Namespace   : ${AKS_NAMESPACE}"
          echo "======================================"
