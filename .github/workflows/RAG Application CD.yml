name: CD - Deploy RAG Backend

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: crsuradev
  REGISTRY: crsuradev.azurecr.io
  IMAGE_NAME: rag-application-demo1
  IMAGE_TAG: v0.3.3

  AZURE_TENANT_ID: 9dbc76ea-fb25-4b07-8f07-5dc315999b76
  AZURE_SUBSCRIPTION_ID: f0550323-fb0b-44d4-8a39-ecf0f6c2dbc9

  AKS_CLUSTER: aks-sura-dev
  AKS_RESOURCE_GROUP: RG-PRY-SURA-PLF-ENGINEERING
  AKS_NAMESPACE: default

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # AZURE LOGIN
      # SERVICE PRINCIPAL + CLIENT SECRET
      # ============================================================
      - name: Azure CLI Login
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          echo "===== AZURE LOGIN ====="
          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az account set \
            --subscription "$AZURE_SUBSCRIPTION_ID"
          echo "===== AZURE ACCOUNT ====="
          az account show \
            --query "{subscription:id,tenantId:tenantId,user:user.name}" \
            --output table
      # ============================================================
      # ACR LOGIN
      # ============================================================
      - name: Azure Container Registry Login
        shell: bash
        run: |
          echo "===== ACR LOGIN ====="
          echo "Registry: ${REGISTRY}"
          az acr show \
            --name "$ACR_NAME" \
            --query "{name:name,loginServer:loginServer}" \
            --output table
          az acr login \
            --name "$ACR_NAME"
      # ============================================================
      # BUILD IMAGE
      # ============================================================
      - name: Build Docker Image
        shell: bash
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "===== BUILDING IMAGE ====="
          echo "Image: ${FULL_IMAGE}"
          docker build \
            --tag "$FULL_IMAGE" \
            .
      # ============================================================
      # PUSH IMAGE
      # ============================================================
      - name: Push Docker Image
        shell: bash
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "===== PUSHING IMAGE ====="
          echo "Image: ${FULL_IMAGE}"
          docker push "$FULL_IMAGE"
      # ============================================================
      # VERIFY IMAGE
      # ============================================================
      - name: Verify Image in ACR
        shell: bash
        run: |
          echo "===== VERIFYING IMAGE ====="
          az acr repository show \
            --name "$ACR_NAME" \
            --image "${IMAGE_NAME}:${IMAGE_TAG}" \
            --output table
      # ============================================================
      # INSTALL KUBECTL + KUBELOGIN
      # ============================================================
      - name: Install kubectl and kubelogin
        shell: bash
        run: |
          echo "===== INSTALLING AKS CLI TOOLS ====="
          az aks install-cli
          echo "===== KUBECTL VERSION ====="
          kubectl version --client
          echo "===== KUBELOGIN VERSION ====="
          kubelogin --version
      # ============================================================
      # GET AKS CREDENTIALS
      # ============================================================
      - name: Get AKS Credentials
        shell: bash
        run: |
          echo "===== GETTING AKS CREDENTIALS ====="
          echo "Cluster: ${AKS_CLUSTER}"
          echo "Resource Group: ${AKS_RESOURCE_GROUP}"
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER" \
            --overwrite-existing
      # ============================================================
      # CONFIGURE KUBELOGIN
      # ============================================================
      - name: Configure kubelogin
        shell: bash
        run: |
          echo "===== CONFIGURING KUBELOGIN ====="
          kubelogin convert-kubeconfig \
            -l azurecli
          echo "===== KUBECONFIG CONFIGURED ====="
      # ============================================================
      # VERIFY AKS CONNECTION
      # ============================================================
      - name: Verify AKS Connection
        shell: bash
        run: |
          echo "===== AKS CONTEXT ====="
          kubectl config current-context
          echo "===== AKS NAMESPACE ====="
          kubectl get namespace "$AKS_NAMESPACE"
          echo "===== CURRENT WORKLOADS ====="
          kubectl get pods \
            -n "$AKS_NAMESPACE"
      # ============================================================
      # DEPLOY KUBERNETES
      # ============================================================
      - name: Deploy with Kustomize
        shell: bash
        run: |
          echo "===== DEPLOYING KUBERNETES RESOURCES ====="
          kubectl apply \
            -k deploy/kubernetes \
            -n "$AKS_NAMESPACE"
      # ============================================================
      # UPDATE IMAGE
      # ============================================================
      - name: Update Deployment Image
        shell: bash
        run: |
          FULL_IMAGE="${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "===== UPDATING DEPLOYMENT IMAGE ====="
          echo "Image: ${FULL_IMAGE}"
          kubectl set image \
            deployment/rag-application-demo1 \
            rag-application-demo1="${FULL_IMAGE}" \
            -n "$AKS_NAMESPACE"
      # ============================================================
      # WAIT FOR ROLLOUT
      # ============================================================
      - name: Wait for Rollout
        shell: bash
        run: |
          echo "===== WAITING FOR ROLLOUT ====="
          kubectl rollout status \
            deployment/rag-application-demo1 \
            -n "$AKS_NAMESPACE" \
            --timeout=180s
      # ============================================================
      # VERIFY DEPLOYMENT
      # ============================================================
      - name: Verify Deployment
        shell: bash
        run: |
          echo "===== DEPLOYMENT ====="
          kubectl get deployment \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"
          echo "===== PODS ====="
          kubectl get pods \
            -n "$AKS_NAMESPACE" \
            -l app.kubernetes.io/name=rag-application-demo1 \
            -o wide
          echo "===== SERVICE ====="
          kubectl get service \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"
          echo "===== HPA ====="
          kubectl get hpa \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"
          echo "===== INGRESS ====="
          kubectl get ingress \
            rag-application-demo1 \
            -n "$AKS_NAMESPACE"
      # ============================================================
      # HEALTH CHECK
      # ============================================================
      - name: Health Check
        shell: bash
        run: |
          echo "===== HEALTH CHECK ====="

          for i in {1..30}; do
            POD=$(kubectl get pods               -n "$AKS_NAMESPACE"               -l app.kubernetes.io/name="$IMAGE_NAME"               --field-selector=status.phase=Running               -o jsonpath='{.items[?(@.status.containerStatuses[0].ready==true)].metadata.name}'               | awk '{print $1}')

            if [ -n "$POD" ]; then
              echo "Testing pod: $POD"
              kubectl exec -n "$AKS_NAMESPACE" "$POD" --                 python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10).read().decode())"
              exit 0
            fi

            echo "Waiting for a Running + Ready pod..."
            sleep 5
          done

          echo "ERROR: No Running + Ready pod found"
          kubectl get pods -n "$AKS_NAMESPACE" -o wide
          exit 1

      - name: Readiness Check
        shell: bash
        run: |
          POD=$(kubectl get pods \
            -n "$AKS_NAMESPACE" \
            -l app.kubernetes.io/name=rag-application-demo1 \
            -o jsonpath='{.items[0].metadata.name}')
          echo "===== READINESS CHECK ====="
          echo "Testing pod: ${POD}"
          kubectl exec \
            -n "$AKS_NAMESPACE" \
            "$POD" \
            -- python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/ready').read().decode())"
      # ============================================================
      # FINAL STATUS
      # ============================================================
      - name: Deployment Summary
        shell: bash
        run: |
          echo "======================================"
          echo "RAG BACKEND DEPLOYMENT COMPLETE"
          echo "======================================"
          echo "Application : ${IMAGE_NAME}"
          echo "Image       : ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          echo "AKS Cluster : ${AKS_CLUSTER}"
          echo "Namespace   : ${AKS_NAMESPACE}"
          echo "======================================"
