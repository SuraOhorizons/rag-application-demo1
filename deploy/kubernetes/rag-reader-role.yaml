apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rag-application-reader
  namespace: default
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]

  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
