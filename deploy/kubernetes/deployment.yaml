apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-application-demo1
  namespace: default
  labels:
    app.kubernetes.io/name: rag-application-demo1
    app.kubernetes.io/managed-by: backstage
    app.kubernetes.io/part-of: open-horizons

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: rag-application-demo1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-application-demo1
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: rag-application-demo1

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: rag-application-demo1

          image: crsuradev.azurecr.io/rag-application-demo1:v0.3.3
          imagePullPolicy: IfNotPresent

          env:
            - name: AZURE_OPENAI_ENDPOINT
              value: "https://ohorizons-agent-test-1787338856.openai.azure.com/"

            - name: AZURE_OPENAI_DEPLOYMENT
              value: "agent-chat"

            - name: AZURE_CLIENT_ID
              value: "152af30a-97c0-4d78-8ab5-1e11c68bbb05"

            - name: AZURE_SEARCH_ENDPOINT
              value: "https://rag-application-demo1-search.search.windows.net"

            - name: AZURE_SEARCH_INDEX
              value: "documents"

          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
