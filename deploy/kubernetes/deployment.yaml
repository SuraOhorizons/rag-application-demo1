apiVersion: apps/v1
kind: Deployment

metadata:
  name: rag-application-demo1
  namespace: default
  labels:
    app.kubernetes.io/name: rag-application-demo1
    app.kubernetes.io/managed-by: backstage
    app.kubernetes.io/part-of: open-horizons

spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: rag-application-demo1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-application-demo1

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001

      containers:
        - name: rag-application-demo1

          image: crsuradev.azurecr.io/rag-application-demo1:v0.1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
