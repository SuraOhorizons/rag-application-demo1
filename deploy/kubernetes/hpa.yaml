apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: 
  labels:
    app.kubernetes.io/name: 
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: 
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
