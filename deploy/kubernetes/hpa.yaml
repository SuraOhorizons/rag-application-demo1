apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: rag-application-demo1
  namespace: default
  labels:
    app.kubernetes.io/name: rag-application-demo1
    app.kubernetes.io/part-of: open-horizons

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-application-demo1

  minReplicas: 2
  maxReplicas: 10

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
      selectPolicy: Max

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
