apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: rag-application-demo1
  namespace: default
  labels:
    app.kubernetes.io/name: rag-application-demo1
    app.kubernetes.io/part-of: open-horizons

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-application-demo1

  minReplicas: 2
  maxReplicas: 10

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
